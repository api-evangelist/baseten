aid: baseten
url: https://raw.githubusercontent.com/api-evangelist/baseten/refs/heads/main/apis.yml
name: Baseten
kind: company
description: >-
  Baseten is a production inference platform for deploying and serving custom and pre-trained ML models. Offers a Model
  APIs catalog with OpenAI-compatible endpoints (DeepSeek, Qwen, GLM, Nemotron), dedicated deployments via Truss,
  autoscaling GPU compute, async/queue inference, training, chains (multi-model workflows), and management APIs.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
  - AI
  - ML
  - Inference
  - Deployment
  - MLOps
  - OpenAI Compatible
  - Anthropic Compatible
  - Truss
created: '2026-05-08'
modified: '2026-05-19'
specificationVersion: '0.19'
