description: >-
  Baseten is a production inference platform for deploying and serving custom and pre-trained ML models. Offers a Model
  APIs catalog with OpenAI-compatible endpoints (DeepSeek, Qwen, GLM, Nemotron), dedicated deployments via Truss,
  autoscaling GPU compute, async/queue inference, training, chains (multi-model workflows), and management APIs.
