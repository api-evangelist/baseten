naftiko: 1.0.0-alpha2
info:
  label: Baseten Anthropic-Compatible Inference API — Messages
  description: 'Baseten Anthropic-Compatible Inference API — Messages. 1 operations. Lead operation: Create a message. Self-contained
    Naftiko capability covering one Baseten business surface.'
  tags:
  - Baseten
  - Messages
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    BASETEN_API_KEY: BASETEN_API_KEY
capability:
  consumes:
  - type: http
    namespace: messages-messages
    baseUri: https://inference.baseten.co
    description: Baseten Anthropic-Compatible Inference API — Messages business capability. Self-contained, no shared references.
    resources:
    - name: v1-messages
      path: /v1/messages
      operations:
      - name: createmessage
        method: POST
        description: Create a message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.BASETEN_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: messages-messages-rest
    port: 8080
    description: REST adapter for Baseten Anthropic-Compatible Inference API — Messages. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/v1/messages
      name: v1-messages
      description: REST surface for v1-messages.
      operations:
      - method: POST
        name: createmessage
        description: Create a message
        call: messages-messages.createmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: messages-messages-mcp
    port: 9090
    transport: http
    description: MCP adapter for Baseten Anthropic-Compatible Inference API — Messages. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: create-message
      description: Create a message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: messages-messages.createmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
